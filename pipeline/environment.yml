# Ambiente do pipeline (conda/mamba, gratuito). Instalar com:
#   conda env create -f environment.yml && conda activate geofloresta
name: geofloresta
channels:
  - conda-forge
dependencies:
  - python=3.12
  - gdal>=3.8
  - numpy>=1.26
  # Tutorial Random Forest (rf_chitwan_*.py)
  - rasterio>=1.3
  - scipy
  - scikit-learn>=1.3
  - matplotlib
  - pillow
